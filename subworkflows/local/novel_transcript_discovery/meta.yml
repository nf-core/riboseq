---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "novel_transcript_discovery"
description: |
  Discover novel transcripts (StringTie on RNA-seq BAMs, with a Ribo-seq
  fallback) or accept a user-supplied novel GTF, then classify against the
  full reference, drop unwanted class codes, optionally subtract a
  strand-aware rRNA/repeat blacklist, and concatenate with the canonical
  backbone to produce a hybrid GTF for downstream alignment and ORF calling.
keywords:
  - stringtie
  - novel transcripts
  - gffcompare
  - hybrid gtf
  - riboseq
components:
  - bam_stringtie_merge
  - gtf_hybridmerge_gffcompare
input:
  - ch_rnaseq_bam:
      description: Genome BAMs flagged as RNA-seq (preferred StringTie input)
      pattern: "*.bam"
  - ch_riboseq_bam:
      description: Genome BAMs flagged as Ribo-seq (StringTie fallback when no RNA-seq present)
      pattern: "*.bam"
  - ch_gtf:
      description: Full multi-isoform reference GTF (for gffcompare class-code annotation)
      pattern: "*.gtf"
  - ch_canonical_gtf:
      description: One-transcript-per-gene backbone, concatenated with filtered novel transcripts
      pattern: "*.gtf"
  - user_novel_gtf:
      description: Optional user-supplied novel GTF; when set, StringTie is skipped
      pattern: "*.gtf"
  - run_stringtie:
      description: Whether to run StringTie (false when --skip_stringtie or --novel_gtf is set)
  - stringtie_class_codes:
      description: gffcompare class codes to retain (--stringtie_class_codes)
  - rrna_blacklist:
      description: Optional BED of rRNA/repeat regions to subtract from the novel set
      pattern: "*.bed"
  - ribo_fallback_args:
      description: StringTie args used for the Ribo-seq fallback (for the warning message)
output:
  - hybrid_gtf:
      description: Canonical + filtered novel transcripts (no meta)
      pattern: "*.gtf"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
