name: run_rpbp
description: |
  End-to-end Rp-Bp execution: render a YAML config from pipeline inputs, build
  the Rp-Bp genome index once, then run `predict-translated-orfs` per Ribo-seq
  sample. Emits per-sample predicted-ORF BED + tab tables with Bayes factor
  scores for downstream multi-caller aggregation.
keywords:
  - rpbp
  - orf
  - bayesian
  - translation
components:
  - rpbp/buildconfig
  - rpbp/preparegenome
  - rpbp/predictorfs
input:
  - ch_bams_for_analysis:
      type: channel
      description: |
        Channel of `[ val(meta), path(bam), path(bai) ]` triples - Ribo-seq
        only (filter upstream).
  - ch_fasta_gtf:
      type: channel
      description: |
        Single-value channel of `[ val(meta), path(fasta), path(gtf) ]` -
        canonical or hybrid GTF depending on `--extended_orf_analysis`.
  - extra_yaml:
      type: string
      description: |
        Free-form YAML appended to the generated config (e.g. min metagene
        counts). Pass `''` for defaults.
output:
  - bed:
      type: channel
      description: Per-sample predicted-ORF BED (Bayes factor scores).
  - tab:
      type: channel
      description: Per-sample predicted-ORF tab table.
  - outdir:
      type: channel
      description: Per-sample full Rp-Bp output directory.
  - versions:
      type: file
      description: File containing software versions.
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
