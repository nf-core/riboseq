# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "build_hybrid_transcriptome"
description: |
  Build a hybrid transcriptome FASTA and STAR index from the canonical-plus-novel
  hybrid GTF, used by the second STAR pass that brings novel intergenic
  transcripts within RiboCode's reach (issue #171).
keywords:
  - riboseq
  - orf
  - star
  - gffread
  - hybrid
components:
  - gffread
  - star/genomegenerate
input:
  - ch_fasta:
      description: Genome FASTA
      pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
  - ch_hybrid_gtf:
      description: Hybrid GTF (canonical backbone + filtered novel intergenic transcripts)
      pattern: "*.gtf"
output:
  - hybrid_transcriptome_fasta:
      description: Spliced transcript sequences extracted from the hybrid GTF
      pattern: "*.fa"
  - hybrid_star_index:
      description: STAR index built against the genome with the hybrid GTF as --sjdbGTFfile
      pattern: "star/"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
