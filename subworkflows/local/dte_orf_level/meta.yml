# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "dte_orf_level"
description: |
  Tier 2 of issue #168. Per-ORF DESeq2 interaction-model differential
  translation analysis: `~ condition + seq_type + condition:seq_type`. The
  Ribo-seq numerator is the per-ORF P-site matrix (#166); the RNA-seq
  denominator is the gene-level Salmon matrix joined per ORF via
  orf_to_gene.tsv (#167).
keywords:
  - riboseq
  - orf
  - dte
  - deseq2
  - differential
components:
  - deseq2/orf_dte
input:
  - ch_contrasts:
      description: Per-contrast tuple `[ contrast_meta, contrast_variable, reference, target ]`
  - ch_orf_count_matrix:
      description: Per-ORF P-site count matrix (`orf_psite_counts.tsv`) from issue #166
      pattern: "*.tsv"
  - ch_rna_counts:
      description: Gene-level Salmon RNA-seq counts (length-scaled)
      pattern: "*.tsv"
  - ch_orf_to_gene:
      description: ORF id -> gene id mapping from the ORF catalogue (#167)
      pattern: "*.tsv"
  - ch_samplesheet:
      description: Pipeline samplesheet CSV
      pattern: "*.csv"
output:
  - results:
      description: Per-contrast per-ORF DESeq2 results table
      pattern: "*.orf_dte.results.tsv"
  - dispersion_plot:
      description: Per-contrast DESeq2 dispersion diagnostic plot
      pattern: "*.orf_dte.dispersions.png"
  - session_info:
      description: Per-contrast R sessionInfo log
      pattern: "*.orf_dte.R_sessionInfo.log"
  - versions:
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
