- doc: Use this if your input FastQ files have already been trimmed outside of the workflow or if you're very confident that there is no adapter contamination in your data.
  id: skip_trimming
  inputBinding:
    prefix: --skip_trimming
  label: --skip_trimming
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
- id: skip_markduplicates
  inputBinding:
