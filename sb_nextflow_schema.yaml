app_content:
  entrypoint: main.nf
  executor_version: 25.10.7
class: nextflow
cwlVersion: None
doc: "![picture](data:image/png;base64,)\n\
  \n[![Open in GitHub Codespaces](https://img.shields.io/badge/Open_In_GitHub_Codespaces-black?labelColor=grey&logo=github)](https://github.com/codespaces/new/nf-core/riboseq)\n[![GitHub Actions CI Status](https://github.com/nf-core/riboseq/actions/workflows/nf-test.yml/badge.svg)](https://github.com/nf-core/riboseq/actions/workflows/nf-test.yml)\n[![GitHub Actions Linting Status](https://github.com/nf-core/riboseq/actions/workflows/linting.yml/badge.svg)](https://github.com/nf-core/riboseq/actions/workflows/linting.yml)[![AWS CI](https://img.shields.io/badge/CI%20tests-full%20size-FF9900?labelColor=000000&logo=Amazon%20AWS)](https://nf-co.re/riboseq/results)[![Cite with Zenodo](http://img.shields.io/badge/DOI-10.5281/zenodo.10966364-1073c8?labelColor=000000)](https://doi.org/10.5281/zenodo.10966364)\n[![nf-test](https://img.shields.io/badge/unit_tests-nf--test-337ab7.svg)](https://www.nf-test.com)\n\n[![Nextflow](https://img.shields.io/badge/version-%E2%89%A525.10.4-green?style=flat&logo=nextflow&logoColor=white&color=%230DC09D&link=https%3A%2F%2Fnextflow.io)](https://www.nextflow.io/)\n[![nf-core template version](https://img.shields.io/badge/nf--core_template-4.0.3-green?style=flat&logo=nfcore&logoColor=white&color=%2324B064&link=https%3A%2F%2Fnf-co.re)](https://github.com/nf-core/tools/releases/tag/4.0.3)\n[![run with conda](http://img.shields.io/badge/run%20with-conda-3EB049?labelColor=000000&logo=anaconda)](https://docs.conda.io/en/latest/)\n[![run with docker](https://img.shields.io/badge/run%20with-docker-0db7ed?labelColor=000000&logo=docker)](https://www.docker.com/)\n[![run with singularity](https://img.shields.io/badge/run%20with-singularity-1d355c.svg?labelColor=000000)](https://sylabs.io/docs/)\n[![Launch on Seqera Platform](https://img.shields.io/badge/Launch%20%F0%9F%9A%80-Seqera%20Platform-%234256e7)](https://cloud.seqera.io/launch?pipeline=https://github.com/nf-core/riboseq)\n\n[![Get help on Slack](http://img.shields.io/badge/slack-nf--core%20%23riboseq-4A154B?labelColor=000000&logo=slack)](https://nfcore.slack.com/channels/riboseq)[![Follow on Bluesky](https://img.shields.io/badge/bluesky-%40nf__core-1185fe?labelColor=000000&logo=bluesky)](https://bsky.app/profile/nf-co.re)[![Follow on Mastodon](https://img.shields.io/badge/mastodon-nf__core-6364ff?labelColor=FFFFFF&logo=mastodon)](https://mstdn.science/@nf_core)[![Watch on YouTube](http://img.shields.io/badge/youtube-nf--core-FF0000?labelColor=000000&logo=youtube)](https://www.youtube.com/c/nf-core)\n\n## Introduction\n\n**nf-core/riboseq** is a bioinformatics pipeline for analysis of Ribo-seq data. It borrows heavily from nf-core/rnaseq in the preprocessing stages:\n\n![nf-core/riboseq metro map](data:image/png;base64,)\n\
  \n1. Merge re-sequenced FastQ files ([`cat`](http://www.linfo.org/cat.html))\n2. Sub-sample FastQ files and auto-infer strandedness ([`fq`](https://github.com/stjude-rust-labs/fq), [`Salmon`](https://combine-lab.github.io/salmon/))\n3. Read QC ([`FastQC`](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/))\n4. UMI extraction ([`UMI-tools`](https://github.com/CGATOxford/UMI-tools))\n5. Adapter and quality trimming ([`Trim Galore!`](https://github.com/FelixKrueger/TrimGalore))\n6. Removal of genome contaminants ([`BBSplit`](http://seqanswers.com/forums/showthread.php?t=41288))\n7. Removal of ribosomal RNA ([`SortMeRNA`](https://github.com/biocore/sortmerna))\n8. Genome alignment of reads, outputting both genome and transcriptome alignments with [`STAR`](https://github.com/alexdobin/STAR)\n9. Sort and index alignments ([`SAMtools`](https://sourceforge.net/projects/samtools/files/samtools/))\n10. UMI-based deduplication ([`UMI-tools`](https://github.com/CGATOxford/UMI-tools))\n\nDifferences occur in the downstream analysis steps. Currently these specialist steps are:\n\n1. Check reads distribution around annotated protein coding regions on user provided transcripts, show frame bias and estimate P-site offset for different group of reads ([`Ribo-TISH`](https://github.com/zhpn1024/ribotish))\n2. (default, optional) Predict translated open reading frames and/ or translation initiation sites _de novo_ from alignment data ([`Ribo-TISH`](https://github.com/zhpn1024/ribotish))\n3. (opt-in, `--run_ribotricer`) Derive candidate ORFs from reference data and detect translated ORFs from that list ([`Ribotricer`](https://github.com/smithlabcode/ribotricer)). Disabled by default: benchmarking found its ORF-score column is rank-unstable across biological replicates, so it is excluded from the default caller set and from cross-caller rank aggregation when enabled.\n4. (default, optional) Identify translated ORFs using P-site periodicity and read density ([`RiboCode`](https://github.com/zhengtaoxiao/RiboCode))\n5. (default, optional) Derive P-sites and QC from transcriptome alignments ([`riboWaltz`](https://github.com/LabTranslationalArchitectomics/riboWaltz), [`plastid`](https://plastid.readthedocs.io/en/latest/index.html))\n6. (optional) Use a translational efficiency approach to study the dynamics of transcription and translation, with [anota2seq](https://bioconductor.org/packages/release/bioc/html/anota2seq.html). **requires matched RNA-seq and Ribo-seq data**\n\n## Usage\n\n> [!NOTE]\n> If you are new to Nextflow and nf-core, please refer to [this page](https://nf-co.re/docs/get_started/environment_setup/overview) on how to set-up Nextflow. Make sure to [test your setup](https://nf-co.re/docs/get_started/run-your-first-pipeline) with `-profile test` before running the workflow on actual data.\n\nFirst, prepare a samplesheet with your input data that looks as follows:\n\n`samplesheet.csv`:\n\n```csv\nsample,fastq_1,fastq_2,strandedness,type\nCONTROL_REP1,AEG588A1_S1_L002_R1_001.fastq.gz,AEG588A1_S1_L002_R2_001.fastq.gz,forward,riboseq\n```\n\nEach row represents a fastq file (single-end) or a pair of fastq files (paired end). Each row should have a 'type' value of `riboseq`, `tiseq` or `rnaseq`. Future iterations of the workflow will conduct paired analysis of matched riboseq and rnaseq samples to accomplish analysis types such as 'translational efficiency, but in the current version you should set this to `riboseq` or `tiseq` for reglar Ribo-seq or TI-seq data respectively.\n\nNow, you can run the pipeline using:\n\n```bash\nnextflow run nf-core/riboseq \\\n   -profile <docker/singularity/.../institute> \\\n   --input samplesheet.csv \\\n   --outdir <OUTDIR>\n```\n\n### Including a translational efficiency analysis\n\n![anota2seq - fold change plot](data:image/png;base64,)\n\
  \nIn the translational efficiency analysis provided by [anota2seq](https://bioconductor.org/packages/release/bioc/html/anota2seq.html), we use matched pairs of Ribo-seq and RNA-seq data to study the relationship between transcription and translation as they differ between two treatment groups. For example the test data for this workflow has a contrasts file like:\n\n```csv\nid,variable,reference,target,batch,pair\ntreated_vs_control,treatment,control,treated,,pair\n```\n\nThis describes how to compare groups of samples between treament groups, and between RNA-seq and Ribo-seq. In order the columns are:\n\n- `id`: a unique identifier to use for the contrast\n- 'variable`: which vaiable (column) of the sample sheet should be used to separate the treatment groups?\n- `reference`: which value of the variable column should be used to select samples to be used as the reference/ base group?\n- `target`: which value of the variable column should be used to select samples to be used as the target/treated group?\n- `batch`: (optional) specify a variable in the sample sheet that defines sample batches\n- `pair`: (optional) specify a variable in the sample sheet that defines sample pairing between RNA-seq and Ribo-seq samples. If not specified, it is assumed that the two types of sample are ordered the same.\n\n> [!WARNING]\n> Please provide pipeline parameters via the CLI or Nextflow `-params-file` option. Custom config files including those provided by the `-c` Nextflow option can be used to provide any configuration _**except for parameters**_; see [docs](https://nf-co.re/docs/running/run-pipelines#using-parameter-files).\n\nFor more details and further functionality, please refer to the [usage documentation](https://nf-co.re/riboseq/usage) and the [parameter documentation](https://nf-co.re/riboseq/parameters).\n\n## Pipeline output\n\nTo see the results of an example test run with a full size dataset refer to the [results](https://nf-co.re/riboseq/results) tab on the nf-core website pipeline page.\nFor more details about the output files and reports, please refer to the\n[output documentation](https://nf-co.re/riboseq/output).\n\n## Credits\n\nnf-core/riboseq was originally written by [Jonathan Manning](https://github.com/pinin4fjords) (Bioinformatics Engineer at Seqera) with support from [Altos Labs](https://www.altoslabs.com/) and in discussion with [Felix Krueger](https://github.com/FelixKrueger) and [Christel Krueger](https://github.com/ChristelKrueger). We thank the following people for their input:\n\n- Anne Bresciani (ZS)\n- [Felipe Almeida](https://github.com/fmalmeida) (ZS)\n- [Mikhail Osipovitch](https://github.com/mosi223) (ZS)\n- [Edward Wallace](https://github.com/ewallace) (University of Edinburgh)\n- [Jack Tierney](https://github.com/JackCurragh) (University College Cork)\n- [Maxime U Garcia](https://github.com/maxulysse) (Seqera)\n- [Ira A Iosub](https://github.com/iraiosub) (The Francis Crick Institute)\n- [Sebastian Uhrig](https://github.com/suhrig) (Freelance bioinformatician)\n\n## Contributions and Support\n\nIf you would like to contribute to this pipeline, please see the [contributing guidelines](docs/CONTRIBUTING.md).\n\nFor further information or help, don't hesitate to get in touch on the [Slack `#riboseq` channel](https://nfcore.slack.com/channels/riboseq) (you can join with [this invite](https://nf-co.re/join/slack)).\n\n## Citations\n\nIf you use nf-core/riboseq for your analysis, please cite it using the following doi: [10.5281/zenodo.10966364](https://doi.org/10.5281/zenodo.10966364)\n\nAn extensive list of references for the tools used by the pipeline can be found in the [`CITATIONS.md`](CITATIONS.md) file.\n\nYou can cite the `nf-core` publication as follows:\n\n> **The nf-core framework for community-curated bioinformatics pipelines.**\n>\n> Philip Ewels, Alexander Peltzer, Sven Fillinger, Harshil Patel, Johannes Alneberg, Andreas Wilm, Maxime Ulysse Garcia, Paolo Di Tommaso & Sven Nahnsen.\n>\n> _Nat Biotechnol._ 2020 Feb 13. doi: [10.1038/s41587-020-0439-x](https://dx.doi.org/10.1038/s41587-020-0439-x).\n"
hints:
- class: sbg:NextflowExecutionMode
  value: single-instance
inputs:
- doc: Select which profile(s) you want to use for task execution.
  id: profile
  inputBinding:
    itemSeparator: ','
    prefix: -profile
  label: -profile
  type:
  - 'null'
  - items:
      name: profile
      symbols:
      - apptainer
      - arm64
      - charliecloud
      - conda
      - debug
      - docker
      - emulate_amd64
      - gpu
      - mamba
      - podman
      - shifter
      - singularity
      - test
      - test_full
      - wave
      type: enum
    type: array
- doc: You will need to create a design file with information about the samples in your experiment before running the pipeline. Use this parameter to specify its location. It has to be a comma-separated file with 3 columns, and a header row. See [usage docs](https://nf-co.re/riboseq/usage#samplesheet-input).
  id: input
  inputBinding:
    prefix: --input
  label: --input
  sbg:category: Input/output options
  sbg:icon: fas fa-file-csv
  sbg:pattern: ^\S+\.(csv|tsv|json|yaml|yml)$
  type:
  - 'null'
  - File
- doc: This file is used to define groups of samples from 'input' to compare.  It must contain at least the columns 'variable', 'reference' and 'target', and optionally a 'batch' column. 'variable' and 'batch' must be columns in the input sample sheet, 'reference' and 'target' are values in the column indicated by 'variable'.
  id: contrasts
  inputBinding:
    prefix: --contrasts
  label: --contrasts
  sbg:category: Input/output options
  sbg:icon: fas fa-adjust
  sbg:pattern: ^\S+\.(csv|tsv|txt)$
  type:
  - 'null'
  - File
- id: output_basename
  inputBinding:
    prefix: --outdir
  label: output_basename (--outdir)
  sbg:category: Input/output options
  sbg:icon: fas fa-folder-open
  type: string
  doc: Directory name passed to Nextflow as --outdir. CAVATICA preserves this directory through the riboseq_results output.
- doc: Set this parameter to your e-mail address to get a summary e-mail with details of the run sent to you when the workflow exits. If set in your user config file (`~/.nextflow/config`) then you don't need to specify this on the command line for every run.
  id: email
  inputBinding:
    prefix: --email
  label: --email
  sbg:category: Input/output options
  sbg:icon: fas fa-envelope
  sbg:pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
  type:
  - 'null'
  - string
- id: multiqc_title
  inputBinding:
    prefix: --multiqc_title
  label: --multiqc_title
  sbg:category: Input/output options
  sbg:icon: fas fa-file-signature
  type:
  - 'null'
  - string
  doc: MultiQC report title. Printed as page header, used for filename if not otherwise specified.
- doc: "If using a reference genome configured in the pipeline using iGenomes (not recommended), use this parameter to give the ID for the reference. This is then used to build the full paths for all required reference genome files e.g. `--genome GRCh38`. \n\nSee the [nf-core website docs](https://nf-co.re/usage/reference_genomes) for more details."
  id: genome
  inputBinding:
    prefix: --genome
  label: --genome
  sbg:category: Reference genome options
  sbg:icon: fas fa-book
  type:
  - 'null'
  - string
- doc: This parameter is *mandatory* if `--genome` is not specified. If you don't have the appropriate alignment index available this will be generated for you automatically. Combine with `--save_reference` to save alignment index for future runs.
  format: text/plain
  id: fasta
  inputBinding:
    prefix: --fasta
  label: --fasta
  sbg:category: Reference genome options
  sbg:icon: far fa-file-code
  sbg:pattern: ^\S+\.fn?a(sta)?(\.gz)?$
  type:
  - 'null'
  - File
- doc: This parameter is *mandatory* if `--genome` is not specified.
  format: text/plain
  id: gtf
  inputBinding:
    prefix: --gtf
  label: --gtf
  sbg:category: Reference genome options
  sbg:icon: fas fa-code-branch
  sbg:pattern: ^\S+\.gtf(\.gz)?$
  type:
  - 'null'
  - File
- doc: This parameter must be specified if `--genome` or `--gtf` are not specified.
  format: text/plain
  id: gff
  inputBinding:
    prefix: --gff
  label: --gff
  sbg:category: Reference genome options
  sbg:icon: fas fa-code-branch
  sbg:pattern: ^\S+\.gff(\.gz)?$
  type:
  - 'null'
  - File
- format: text/plain
  id: transcript_fasta
  inputBinding:
    prefix: --transcript_fasta
  label: --transcript_fasta
  sbg:category: Reference genome options
  sbg:icon: far fa-file-code
  sbg:pattern: ^\S+\.fn?a(sta)?(\.gz)?$
  type:
  - 'null'
  - File
  doc: Path to FASTA transcriptome file.
- doc: If provided, the sequences in this file will get concatenated to the existing genome FASTA file, a GTF file will be automatically created using the entire sequence as the gene, transcript, and exon features, and any alignment index will get created from the combined FASTA and GTF. It is recommended to save the reference with `--save_reference` to re-use the index for future runs so you do not need to create it again.
  format: text/plain
  id: additional_fasta
  inputBinding:
    prefix: --additional_fasta
  label: --additional_fasta
  sbg:category: Reference genome options
  sbg:icon: far fa-file-code
  sbg:pattern: ^\S+\.fn?a(sta)?(\.gz)?$
  type:
  - 'null'
  - File
- id: star_index
  inputBinding:
    prefix: --star_index
  label: --star_index
  sbg:category: Reference genome options
  sbg:icon: fas fa-bezier-curve
  type:
  - 'null'
  - File
  doc: Path to directory or tar.gz archive for pre-built STAR index.
- id: salmon_index
  inputBinding:
    prefix: --salmon_index
  label: --salmon_index
  sbg:category: Reference genome options
  sbg:icon: fas fa-bezier-curve
  type:
  - 'null'
  - File
  doc: Path to directory or tar.gz archive for pre-built Salmon index.
- doc: Only used with `--pseudo_aligner kallisto` and `--te_quantification_method pseudo`. This is the single index file written by `kallisto index -i`, not a directory. It must have been built with a k-mer size appropriate for Ribo-seq read lengths; see `--pseudo_aligner_kmer_size`.
  id: kallisto_index
  inputBinding:
    prefix: --kallisto_index
  label: --kallisto_index
  sbg:category: Reference genome options
  sbg:icon: fas fa-bezier-curve
  type:
  - 'null'
  - File
- id: gencode
  inputBinding:
    prefix: --gencode
  label: --gencode
  sbg:category: Reference genome options
  sbg:icon: fas fa-code-branch
  type:
  - 'null'
  - boolean
  doc: Specify if your GTF annotation is in GENCODE format.
- doc: 'This behaviour can be modified by specifying `--gtf_extra_attributes` when running the pipeline. Note that you can also specify more than one desired value, separated by a comma e.g. `--gtf_extra_attributes gene_id,...`.

    '
  id: gtf_extra_attributes
  inputBinding:
    prefix: --gtf_extra_attributes
  label: --gtf_extra_attributes
  sbg:category: Reference genome options
  sbg:icon: fas fa-plus-square
  sbg:toolDefaultValue: gene_name
  type:
  - 'null'
  - string
- id: gtf_group_features
  inputBinding:
    prefix: --gtf_group_features
  label: --gtf_group_features
  sbg:category: Reference genome options
  sbg:icon: fas fa-layer-group
  sbg:toolDefaultValue: gene_id
  type:
  - 'null'
  - string
  doc: Define the attribute type used to group features in the GTF file when running Salmon.
- doc: "When supplied, this GTF replaces the full multi-isoform `--gtf` as the annotation backbone for the genome-coordinate ORF callers (Ribo-TISH, Ribotricer), plastid P-site quantification and the translational-efficiency analysis. The full `--gtf` is retained both for genome-guided alignment (STAR/Salmon) and for the transcriptome-coordinate tools (RiboCode, riboWaltz, Salmon), whose input is the reference-transcriptome BAM and so must match the full multi-isoform transcript set. When omitted, the pipeline falls back to AGAT longest-CDS-isoform extraction from the full GTF; if that is unavailable, the full GTF is used as the backbone (with a multi-isoform ambiguity warning). Recommended sources: MANE Select for human (https://ftp.ncbi.nlm.nih.gov/refseq/MANE/MANE_human/current/), or `grep 'tag \"Ensembl_canonical\"' input.gtf > canonical.gtf` for any Ensembl organism at release ≥104."
  format: text/plain
  id: canonical_gtf
  inputBinding:
    prefix: --canonical_gtf
  label: --canonical_gtf
  sbg:category: Reference genome options
  sbg:icon: fas fa-code-branch
  sbg:pattern: ^\S+\.gtf(\.gz)?$
  type:
  - 'null'
  - File
- doc: Do not load `igenomes.config` when running the pipeline. You may choose this option if you observe clashes between custom parameters and those supplied in `igenomes.config`.
  id: igenomes_ignore
  inputBinding:
    prefix: --igenomes_ignore
  label: --igenomes_ignore
  sbg:category: Reference genome options
  sbg:hidden: true
  sbg:icon: fas fa-ban
  type:
  - 'null'
  - boolean
- id: igenomes_base
  inputBinding:
    prefix: --igenomes_base
  label: --igenomes_base
  sbg:category: Reference genome options
  sbg:hidden: true
  sbg:icon: fas fa-ban
  sbg:toolDefaultValue: s3://ngi-igenomes/igenomes/
  type:
  - 'null'
  - string
  doc: The base path to the igenomes reference files
- id: trimmer
  inputBinding:
    prefix: --trimmer
  label: --trimmer
  sbg:category: Read trimming options
  sbg:icon: fas fa-cut
  sbg:toolDefaultValue: trimgalore
  type:
  - 'null'
  - name: trimmer
    symbols:
    - trimgalore
    - fastp
    type: enum
  doc: Specifies the trimming tool to use - available options are 'trimgalore' and 'fastp'.
- id: extra_trimgalore_args
  inputBinding:
    prefix: --extra_trimgalore_args
  label: --extra_trimgalore_args
  sbg:category: Read trimming options
  sbg:icon: fas fa-plus
  type:
  - 'null'
  - string
  doc: Extra arguments to pass to Trim Galore! command in addition to defaults defined by the pipeline.
- id: extra_fastp_args
  inputBinding:
    prefix: --extra_fastp_args
  label: --extra_fastp_args
  sbg:category: Read trimming options
  sbg:icon: fas fa-plus
  type:
  - 'null'
  - string
  doc: Extra arguments to pass to fastp command in addition to defaults defined by the pipeline.
- id: min_trimmed_reads
  inputBinding:
    prefix: --min_trimmed_reads
  label: --min_trimmed_reads
  sbg:category: Read trimming options
  sbg:icon: fas fa-hand-paper
  sbg:toolDefaultValue: 10000
  type:
  - 'null'
  - int
  doc: Minimum number of trimmed reads below which samples are removed from further processing. Some downstream steps in the pipeline will fail if this threshold is too low.
- id: fastp_merge
  inputBinding:
    prefix: --fastp_merge
  label: --fastp_merge
  sbg:category: Read trimming options
  sbg:icon: fas fa-compress-alt
  sbg:toolDefaultValue: false
  type:
  - 'null'
  - boolean
  doc: For paired-end data processed with fastp, merge overlapping read pairs into a single read.
- id: extra_fqlint_args
  inputBinding:
    prefix: --extra_fqlint_args
  label: --extra_fqlint_args
  sbg:category: Read filtering options
  sbg:icon: far fa-check-square
  sbg:toolDefaultValue: --disable-validator P001
  type:
  - 'null'
  - string
  doc: Extra arguments to pass to the fq lint command.
- doc: "The file should contain 2 columns: short name and full path to reference genome(s) e.g. \n```\nmm10,/path/to/mm10.fa\necoli,/path/to/ecoli.fa\n```"
  format: text/plain
  id: bbsplit_fasta_list
  inputBinding:
    prefix: --bbsplit_fasta_list
  label: --bbsplit_fasta_list
  sbg:category: Read filtering options
  sbg:icon: fas fa-list-alt
  type:
  - 'null'
  - File
- doc: The BBSplit index will have to be built at least once with this pipeline (see `--save_reference` to save index). It can then be provided via `--bbsplit_index` for future runs.
  id: bbsplit_index
  inputBinding:
    prefix: --bbsplit_index
  label: --bbsplit_index
  sbg:category: Read filtering options
  sbg:icon: fas fa-bezier-curve
  type:
  - 'null'
  - File
- doc: The sortmerna index will have to be built at least once with this pipeline (see `--save_reference` to save index). It can then be provided via `--sortmerna_index` for future runs.
  id: sortmerna_index
  inputBinding:
    prefix: --sortmerna_index
  label: --sortmerna_index
  sbg:category: Read filtering options
  sbg:icon: fas fa-bezier-curve
  type:
  - 'null'
  - File
- doc: Any patterns found in the sequences defined by the '--ribo_database_manifest' parameter will be used. The tool used can be selected with '--ribo_removal_tool'.
  id: remove_ribo_rna
  inputBinding:
    prefix: --remove_ribo_rna
  label: --remove_ribo_rna
  sbg:category: Read filtering options
  sbg:icon: fas fa-trash-alt
  sbg:toolDefaultValue: true
  type:
  - 'null'
  - boolean
- doc: Available options are 'sortmerna', 'bowtie2', and 'ribodetector'. SortMeRNA uses k-mer matching against rRNA databases. Bowtie2 aligns reads against rRNA references and filters aligned reads. RiboDetector uses machine learning to identify rRNA reads without requiring a reference database.
  id: ribo_removal_tool
  inputBinding:
    prefix: --ribo_removal_tool
  label: --ribo_removal_tool
  sbg:category: Read filtering options
  sbg:icon: fas fa-trash-alt
  sbg:toolDefaultValue: sortmerna
  type:
  - 'null'
  - name: ribo_removal_tool
    symbols:
