- doc: The ORF-level analysis runs the same deltaTE DESeq2 module as the gene-level path after a join step expands the gene-level RNA-seq matrix onto ORF rows via `orf_to_gene.tsv`. ORFs whose host gene is absent from the RNA-seq matrix, and novel intergenic ORFs with no host gene, are dropped at the join step.
