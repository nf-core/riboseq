  label: --equalise_read_lengths
  sbg:category: Riboseq-specific options
  sbg:icon: fas fa-ruler-horizontal
  sbg:toolDefaultValue: false
  type:
  - 'null'
  - boolean
  doc: Trim RNA-seq reads to match Ribo-seq read lengths before quantification. This addresses potential biases when comparing the two modalities due to different read lengths.
- id: equalise_read_lengths_target
  inputBinding:
    prefix: --equalise_read_lengths_target
  label: --equalise_read_lengths_target
  sbg:category: Riboseq-specific options
  sbg:icon: fas fa-ruler
  type:
  - 'null'
  - int
  doc: Target read length for RNA-seq trimming. If not specified, the average Ribo-seq read length will be derived from paired samples using seqkit stats. This parameter is required if RNA-seq samples have no paired Ribo-seq sample.
- doc: 'Default is ''plastid_psite'': Ribo-seq reads are counted only when their inferred P-site coincides with an in-frame codon position in an annotated CDS (derived from plastid wiggle tracks). This is the scientifically appropriate quantity for Ribo-seq, because Salmon''s underlying assumptions (uniform coverage, fragment-length distribution, multi-mapping resolution from longer/paired reads) are violated by short, length-constrained Ribo-seq footprints (see Ribomap, Bioinformatics 2016). Choose ''alignment'' to keep STAR alignment followed by Salmon in alignment-based mode, e.g. for backward compatibility, comparison with prior runs, or downstream tools that expect Salmon-format transcript-level counts. Choose ''pseudo'' for direct Salmon pseudo-alignment from reads, an experimental alternative that uses the same k-mer index for both modalities and may help reduce length-related quantification biases without requiring read trimming.'
  id: te_quantification_method
  inputBinding:
    prefix: --te_quantification_method
  label: '--te_quantification_method'
  sbg:category: Riboseq-specific options
  sbg:icon: fas fa-calculator
  sbg:toolDefaultValue: plastid_psite
  type:
  - 'null'
  - name: te_quantification_method
    symbols:
    - alignment
    - pseudo
    - plastid_psite
    type: enum
