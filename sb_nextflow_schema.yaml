- id: skip_multiqc
  inputBinding:
    prefix: --skip_multiqc
  label: --skip_multiqc
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
  doc: Skip MultiQC.
- id: skip_qc
  inputBinding:
    prefix: --skip_qc
  label: --skip_qc
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
  doc: Skip all QC steps except for MultiQC.
- id: skip_coverage_tracks
  inputBinding:
    prefix: --skip_coverage_tracks
  label: --skip_coverage_tracks
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
  doc: Skip bigWig coverage track generation.
- id: skip_ribotish
  inputBinding:
    prefix: --skip_ribotish
  label: --skip_ribotish
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
  doc: Skip Ribo-TISH.
- doc: Ribotricer is disabled by default because benchmark data (FK/NGB, May 2026) showed its ORF-score column is rank-unstable across biological replicates (mean Spearman 0.288 vs Jaccard 0.770). Its binary call set is reproducible, but the score should not be used as a primary ranking source. Enable with `--run_ribotricer true` if you need its calls; the pipeline will warn at runtime and exclude its score column from any cross-caller rank aggregation.
  id: run_ribotricer
  inputBinding:
    prefix: --run_ribotricer
  label: --run_ribotricer
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
- id: skip_ribocode
  inputBinding:
    prefix: --skip_ribocode
  label: --skip_ribocode
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
  doc: Skip RiboCode.
- id: skip_ribowaltz
  inputBinding:
    prefix: --skip_ribowaltz
  label: --skip_ribowaltz
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
  doc: Skip riboWaltz.
- id: skip_plastid
  inputBinding:
    prefix: --skip_plastid
  label: --skip_plastid
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
  doc: Skip plastid.
- doc: When `false`, the pipeline runs StringTie per sample (reference-guided) then merges per-sample GTFs into a unified annotation. RNA-seq BAMs are used for assembly. Merged transcripts are classified with gffcompare and filtered to class codes set by `--gffcompare_class_codes`. The filtered novel GTF is concatenated with `--canonical_gtf` to produce `<outdir>/stringtie/hybrid_reference.gtf`. Ignored when `--novel_gtf` is supplied.
  id: skip_stringtie
  inputBinding:
    prefix: --skip_stringtie
  label: --skip_stringtie
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  sbg:toolDefaultValue: true
  type:
  - 'null'
  - boolean
- doc: Useful when you already have a curated cell-type-specific annotation (e.g. from long-read RNA-seq or a published ORF catalogue). The supplied GTF is still passed through the gffcompare class-code filter (`--gffcompare_class_codes`, default `u` = intergenic only) so users can submit annotations containing any class of transcript and have the pipeline retain only the intergenic ones.
  format: text/plain
  id: novel_gtf
  inputBinding:
    prefix: --novel_gtf
  label: --novel_gtf
  sbg:category: Process skipping options
  sbg:icon: fas fa-file-import
  sbg:pattern: ^\S+\.gtf(\.gz)?$
  type:
  - 'null'
  - File
- doc: Default `u` keeps only unambiguously intergenic transcripts. Stranded users may add `x` (antisense overlap with a known locus) via `--gffcompare_class_codes 'u,x'` to recover translated antisense transcripts; this is unsafe for non-stranded or partially-stranded protocols. See https://ccb.jhu.edu/software/stringtie/gffcompare.shtml for the full class-code list.
  id: gffcompare_class_codes
  inputBinding:
    prefix: --gffcompare_class_codes
  label: --gffcompare_class_codes
  sbg:category: Process skipping options
  sbg:icon: fas fa-filter
  sbg:toolDefaultValue: u
  type:
  - 'null'
  - string
- doc: When supplied, novel transcripts overlapping the blacklist on the same strand are removed via `bedtools intersect -v -s`. UCSC publishes ready-made blacklists for hg38 and mm10; for other organisms you must construct one yourself or omit this parameter (the step is skipped silently).
  format: text/plain
  id: rrna_blacklist
  inputBinding:
    prefix: --rrna_blacklist
  label: --rrna_blacklist
  sbg:category: Process skipping options
  sbg:icon: fas fa-ban
  sbg:pattern: ^\S+\.bed(\.gz)?$
  type:
  - 'null'
  - File
- doc: When true and a novel-transcript source is enabled (--skip_stringtie false or --novel_gtf), the hybrid GTF (<outdir>/stringtie/hybrid_reference.gtf) is passed to Ribo-TISH predict (-g) and Ribotricer prepare-orfs so that novel intergenic ORFs are within scope. RiboCode, riboWaltz and Salmon continue to read the reference transcriptome, and plastid P-site quantification the canonical backbone, regardless of this flag (RiboCode's transcriptome-coordinate BAM is keyed to the reference transcriptome FASTA used at alignment time). This flag also gates the cross-caller ORF catalogue, per-ORF P-site quantification and ORF-level differential translation, none of which need novel transcripts. When true but no novel-transcript source is configured, hybrid routing into the callers is a no-op and a warning is emitted, but the catalogue is still built against the full reference annotation.
  id: extended_orf_analysis
  inputBinding:
    prefix: --extended_orf_analysis
  label: --extended_orf_analysis
  sbg:category: Process skipping options
  sbg:icon: fas fa-expand-arrows-alt
  type:
  - 'null'
  - boolean
- doc: PRICE (Probabilistic inference of codon activities, Erhard et al. 2018) is a Bayesian ORF caller distributed as part of the Gedi Java framework (`gedi -e Price`). It is opt-in because the EM fit dominates runtime at full scale. PRICE is invoked once across the riboseq cohort (it estimates a shared codon-position model) so the whole BAM cohort is staged into a single task; expect higher disk I/O than per-sample callers on local executors. PRICE joins the cross-caller ORF catalogue alongside Ribo-TISH, RiboCode and Ribotricer.
  id: run_price
  inputBinding:
    prefix: --run_price
  label: --run_price
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
- doc: Rp-Bp (Malone et al. 2017) is a Bayesian-strict ORF caller that complements RiboCode's permissive canonical-CDS calls. Runtime is on the order of 20-24h per replicate at genome-wide scale because the MCMC fit dominates, hence it is opt-in. Plan accordingly. Rp-Bp's score column (Bayes factor) participates in the cross-caller rank aggregation alongside RiboCode and Ribo-TISH.
  id: run_rpbp
  inputBinding:
    prefix: --run_rpbp
  label: --run_rpbp
  sbg:category: Process skipping options
  sbg:icon: fas fa-fast-forward
  type:
  - 'null'
  - boolean
- id: extra_rpbp_preparegenome_args
  inputBinding:
    prefix: --extra_rpbp_preparegenome_args
  label: --extra_rpbp_preparegenome_args
  sbg:category: Process skipping options
  sbg:icon: fas fa-terminal
  type:
  - 'null'
  - string
  doc: Extra CLI arguments passed to `prepare-rpbp-genome`.
- id: extra_rpbp_predictorfs_args
  inputBinding:
    prefix: --extra_rpbp_predictorfs_args
  label: --extra_rpbp_predictorfs_args
  sbg:category: Process skipping options
  sbg:icon: fas fa-terminal
  type:
  - 'null'
  - string
  doc: Extra CLI arguments passed to `select-final-prediction-set`.
- doc: By default the catalogue clusters its amino-acid sequences with MMseqs2 (`--min-seq-id 0.9 -c 0.8`) and folds each multi-member smORF (aa_length <= 100) cluster down to one representative, following the GENCODE Ribo-seq ORF catalogue convention (Mudge et al. 2022). Set true to publish the coordinate-merged catalogue without this sequence-level collapse, e.g. when you want to inspect every redundant copy. Has no effect unless `--extended_orf_analysis true`.
  id: skip_orf_collapse
  inputBinding:
    prefix: --skip_orf_collapse
  label: --skip_orf_collapse
  sbg:category: Process skipping options
  sbg:icon: fas fa-layer-group
  type:
  - 'null'
  - boolean
- doc: The full catalogue is an unfiltered cross-caller/cross-sample union and is always published. In addition, a consensus view (`orf_catalogue/consensus/`) is published containing only ORFs supported by at least this many distinct callers (and at least `--orf_min_samples` samples). Default 1 applies no caller filter, so the consensus view equals the full merged catalogue. Set 2 or higher for a higher-confidence catalogue that tames downstream ORF-level multiple testing.
  id: orf_min_callers
  inputBinding:
    prefix: --orf_min_callers
  label: --orf_min_callers
  sbg:category: Process skipping options
  sbg:icon: fas fa-users
  sbg:toolDefaultValue: 1
  type:
  - 'null'
  - int
- doc: Companion to `--orf_min_callers`. The consensus view (`orf_catalogue/consensus/`) retains only ORFs seen in at least this many distinct samples. Default 1 applies no recurrence filter.
  id: orf_min_samples
  inputBinding:
    prefix: --orf_min_samples
  label: --orf_min_samples
  sbg:category: Process skipping options
  sbg:icon: fas fa-vials
  sbg:toolDefaultValue: 1
  type:
  - 'null'
  - int
- id: custom_config_version
  inputBinding:
