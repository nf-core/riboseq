  - 'null'
  - string
  doc: Comma-separated list of translational efficiency methods to run; any of `anota2seq`, `deltate`, `dotseq`. Each runs independently. `dotseq` is ORF-level only (no gene-level fit) and requires `--extended_orf_analysis true`.
