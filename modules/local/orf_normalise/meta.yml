name: orf_normalise
description: |
  Convert a per-sample output from an ORF caller into a unified BED12 plus a
  sidecar metadata TSV, ready for cross-caller merging.

  An "ORF caller" is a tool that scans ribosome-profiling (Ribo-seq) data and
  predicts which open reading frames are being translated. Each caller writes
  its own table format and uses its own location encoding, classification
  vocabulary, and confidence score. This module reconciles the five callers
  the pipeline supports into one cohort-wide schema.

  meta.caller selects the input format. Supported values:
    - ribocode    (RiboCode predicted ORF table; transcript-coord input,
                   lifted to genomic blocks against the GTF)
    - ribotish    (Ribo-TISH predict output; GenomePos + optional Blocks)
    - ribotricer  (Ribotricer detect-orfs translating ORFs TSV;
                   coordinate column already genomic)
    - rpbp        (Rp-Bp predicted-orfs BED12 with extra columns)
    - price       (PRICE orfs.tsv; Gedi-style Location field, already genomic)

  Harmonised orf_class vocabulary (written into the sidecar TSV's orf_class
  column):
    - canonical_cds: ORF maps to an annotated CDS (or a truncated / extended
                     variant of one)
    - uORF:          upstream ORF (5'UTR-resident)
    - dORF:          downstream ORF (3'UTR-resident)
    - novel_u:       novel / intergenic ORF not assigned to an annotated CDS
    - smORF:         small ORF (aa_length <= 100); promoted regardless of
                     location-based class
    - other:         did not match any of the above (e.g. internal,
                     overlap, frame variants)

  Each caller's native confidence has a "direction" - some are lower-is-better
  (p-values) and some are higher-is-better (Bayes factors, phase scores):
    ribocode: min  (combined p-value)
    ribotish: min  (combined p-value)
    ribotricer: max (phase_score)
    rpbp: max  (Bayes factor mean)
    price: min  (p-value)
  The downstream catalogue-merge step uses this to pick the best per-ORF
  call when collapsing across callers.

keywords:
  - orf
  - ribo-seq
  - normalisation
  - bed12
tools:
  - "ribocode":
      description: "Identifying genome-wide translated open reading frames"
      homepage: "https://github.com/xryanglab/RiboCode"
      documentation: "https://github.com/xryanglab/RiboCode"
      doi: "10.1093/nar/gky179"
      licence: ["GPL-3.0"]
  - "ribotish":
      description: "Ribo-seq based ORF prediction (Ribo-TISH)"
      homepage: "https://github.com/zhpn1024/ribotish"
      documentation: "https://github.com/zhpn1024/ribotish"
      doi: "10.1038/s41467-017-01981-8"
      licence: ["GPL-3.0"]
  - "ribotricer":
      description: "Ribosome profiling P-site phasing analysis"
      homepage: "https://github.com/smithlabcode/ribotricer"
      documentation: "https://github.com/smithlabcode/ribotricer"
      doi: "10.1093/bioinformatics/btz878"
      licence: ["GPL-3.0"]
  - "rpbp":
      description: "Translated ORF identification with Rp-Bp"
      homepage: "https://github.com/dieterich-lab/rp-bp"
      documentation: "https://github.com/dieterich-lab/rp-bp"
      doi: "10.1093/nar/gkw1141"
      licence: ["MIT"]
  - "price":
      description: "Probabilistic inference of codon activities by an EM algorithm"
      homepage: "https://github.com/erhard-lab/price"
      documentation: "https://github.com/erhard-lab/price"
      doi: "10.1038/nmeth.4631"
      licence: ["Apache-2.0"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map. Must include `id` (sample identifier; for PRICE this is
          typically the cohort id) and `caller` (one of: ribocode, ribotish,
          ribotricer, rpbp, price).
    - orfs_table:
        type: file
        description: |
          Per-sample (or cohort, for PRICE) ORF caller output. The format
          must match meta.caller.
        pattern: "*"
  - - meta2:
        type: map
        description: |
          Groovy Map for the annotation (typically `[id: 'reference']`).
    - gtf:
        type: file
        description: |
          Annotation GTF used for transcript -> gene lookups and (for
          ribocode / ribotish) lifting transcript coordinates to genomic
          blocks. Unused content is harmless for callers that emit genomic
          coordinates directly (ribotricer, rpbp, price).
        pattern: "*.gtf"
output:
  - bed12:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.bed12":
          type: file
          description: |
            Normalised BED12 with genomic ORF blocks. BED 'name' column
            encodes "<caller>|<caller-native-id>"; BED 'score' is mapped to
            the 0-1000 range from the caller's native score.
          pattern: "*.normalised.bed12"
  - tsv:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.tsv":
          type: file
          description: |
            Per-ORF metadata sidecar with columns: orf_id, caller, sample_id,
            chrom, start, end, strand, gene_id, transcript_id, orf_class,
            aa_length, score (native).
          pattern: "*.normalised.tsv"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions.
          pattern: "versions.yml"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
