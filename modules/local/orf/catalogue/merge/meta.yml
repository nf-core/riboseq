name: orf_catalogue_merge
description: |
  Merge per-sample normalised ORF BED12s (across callers and samples) into
  a single run-level catalogue. Applies the issue #167 strategy:
    - Annotated multi-exon CDS: collapse by transcript_id.
    - Single-exon novel intergenic: reciprocal overlap (>=80%).
    - smORFs (<=100 aa): reciprocal overlap; AA-sequence dedup is handled
      downstream in `orf_catalogue_extract_aa`.
  Cross-caller consensus is recorded in `called_by_*` and `score_*` columns.
keywords:
  - orf
  - catalogue
  - merge
  - bedtools
  - cd-hit
input:
  - - meta:
        type: map
        description: |
          Groovy Map, typically a cohort-level id.
    - bed12s:
        type: list
        description: List of normalised per-sample/per-caller BED12 files.
    - tsvs:
        type: list
        description: Matching list of normalised sidecar TSV files.
output:
  - catalogue_bed:
      - meta:
          type: map
      - orf_catalogue.bed12:
          type: file
          description: Merged ORF catalogue as BED12 (genomic blocks).
          pattern: "orf_catalogue.bed12"
  - catalogue_tsv:
      - meta:
          type: map
      - orf_catalogue.tsv:
          type: file
          description: |
            Per-ORF table with `called_by_<caller>` and `score_<caller>`
            columns plus class, aa_length, gene/transcript ids.
          pattern: "orf_catalogue.tsv"
  - orf_to_gene:
      - meta:
          type: map
      - orf_to_gene.tsv:
          type: file
          description: |
            One row per (orf_id, gene_id, transcript_id) mapping. An ORF can
            map to multiple host transcripts/genes; gene-level aggregation
            (#168) collapses these.
          pattern: "orf_to_gene.tsv"
  - mqc:
      - meta:
          type: map
      - orf_catalogue.mqc.tsv:
          type: file
          description: |
            MultiQC custom-content TSV with per-class ORF counts.
          pattern: "orf_catalogue.mqc.tsv"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
