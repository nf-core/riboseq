name: orf_catalogue_extractaa
description: |
  Extract amino acid sequences for every ORF in the merged BED12 catalogue.
  Fetches per-block nucleotide sequence with pysam, concatenates blocks in
  mRNA-coord order, reverse-complements on `-` strand, and translates with
  the standard genetic code. Emits a FASTA (one record per ORF) keyed by
  the catalogue's stable `orf_NNN` id.
keywords:
  - orf
  - catalogue
  - translation
  - fasta
input:
  - - meta:
        type: map
        description: |
          Groovy Map, typically a cohort-level id.
    - catalogue_bed:
        type: file
        description: Merged ORF catalogue BED12.
        pattern: "*.bed12"
  - - meta2:
        type: map
        description: |
          Reference meta (typically a reference id).
    - fasta:
        type: file
        description: Genome FASTA.
        pattern: "*.{fa,fasta,fna}"
output:
  - faa:
      - meta:
          type: map
      - orf_catalogue.faa:
          type: file
          description: Amino-acid FASTA of all ORFs in the catalogue.
          pattern: "orf_catalogue.faa"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
