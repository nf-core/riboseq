name: orf_normalise_ribotish
description: |
  Convert a Ribo-TISH `predict` per-sample output (`*_pred.txt`) into a
  unified BED12 + sidecar metadata TSV suitable for cross-caller merging.
  The BED12 uses the genomic block coordinates emitted by Ribo-TISH; the
  sidecar TSV carries `orf_id, caller, sample_id, chrom, start, end,
  strand, gene_id, transcript_id, orf_class, aa_length, score`.
keywords:
  - ribotish
  - orf
  - normalisation
  - bed12
input:
  - - meta:
        type: map
        description: |
          Groovy Map with at least `id` (used as sample_id).
    - pred_txt:
        type: file
        description: Ribo-TISH predict output table (`*_pred.txt`).
        pattern: "*_pred.txt"
  - - meta2:
        type: map
        description: |
          Groovy Map for the annotation (typically a reference id).
    - gtf:
        type: file
        description: Annotation GTF (canonical or hybrid) used for coordinate validation.
        pattern: "*.gtf"
output:
  - bed12:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.bed12":
          type: file
          description: Normalised BED12 with genomic ORF blocks.
          pattern: "*.normalised.bed12"
  - tsv:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.tsv":
          type: file
          description: Per-ORF metadata sidecar (caller, sample, classification, score).
          pattern: "*.normalised.tsv"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
