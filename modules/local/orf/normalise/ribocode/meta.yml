name: orf_normalise_ribocode
description: |
  Convert a RiboCode per-sample ORF table (`*.txt`) into a unified BED12 +
  sidecar metadata TSV suitable for cross-caller merging. RiboCode reports
  transcript-coordinate ORFs; this normaliser lifts those to genomic
  BED12 blocks using the GTF's exon model.
keywords:
  - ribocode
  - orf
  - normalisation
  - bed12
input:
  - - meta:
        type: map
        description: |
          Groovy Map with at least `id` (used as sample_id).
    - orf_txt:
        type: file
        description: RiboCode predicted ORF table.
        pattern: "*.txt"
  - - meta2:
        type: map
        description: |
          Groovy Map for the annotation (typically a reference id).
    - gtf:
        type: file
        description: Annotation GTF (canonical or hybrid) used for coordinate validation.
        pattern: "*.gtf"
output:
  - bed12:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.bed12":
          type: file
          description: Normalised BED12 with genomic ORF blocks.
          pattern: "*.normalised.bed12"
  - tsv:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.tsv":
          type: file
          description: Per-ORF metadata sidecar.
          pattern: "*.normalised.tsv"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
