name: orf_normalise_ribotricer
description: |
  Convert a Ribotricer `detect-orfs` per-sample table
  (`*_translating_ORFs.tsv`) into a unified BED12 + sidecar metadata TSV.
  Ribotricer's score column is excluded from cross-caller rank aggregation
  per issue #163.
keywords:
  - ribotricer
  - orf
  - normalisation
  - bed12
input:
  - - meta:
        type: map
        description: |
          Groovy Map with at least `id` (used as sample_id).
    - translating_orfs:
        type: file
        description: Ribotricer `*_translating_ORFs.tsv` table.
        pattern: "*_translating_ORFs.tsv"
  - - meta2:
        type: map
        description: |
          Groovy Map for the annotation (typically a reference id).
    - gtf:
        type: file
        description: Annotation GTF (canonical or hybrid) used for coordinate validation.
        pattern: "*.gtf"
output:
  - bed12:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.bed12":
          type: file
          description: Normalised BED12 with genomic ORF blocks.
          pattern: "*.normalised.bed12"
  - tsv:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.tsv":
          type: file
          description: Per-ORF metadata sidecar.
          pattern: "*.normalised.tsv"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
