name: orf_normalise_rpbp
description: |
  Convert an Rp-Bp `predict-translated-orfs` per-sample output
  (`*.predicted-orfs.bed.gz`) into a unified BED12 + sidecar metadata TSV.
  Rp-Bp already emits BED12 with Bayes-factor scores; this normaliser
  harmonises the metadata columns and gunzips for downstream tooling.
keywords:
  - rpbp
  - orf
  - normalisation
  - bed12
input:
  - - meta:
        type: map
        description: |
          Groovy Map with at least `id` (used as sample_id).
    - predicted_bed:
        type: file
        description: Rp-Bp `*.predicted-orfs.bed.gz` table.
        pattern: "*.predicted-orfs.bed.gz"
  - - meta2:
        type: map
        description: |
          Groovy Map for the annotation (typically a reference id).
    - gtf:
        type: file
        description: Annotation GTF (canonical or hybrid) used for coordinate validation.
        pattern: "*.gtf"
output:
  - bed12:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.bed12":
          type: file
          description: Normalised BED12 with genomic ORF blocks.
          pattern: "*.normalised.bed12"
  - tsv:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.normalised.tsv":
          type: file
          description: Per-ORF metadata sidecar.
          pattern: "*.normalised.tsv"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
