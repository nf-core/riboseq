# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: quantify_inframe_psite_orf
description: |
  Count plastid wiggle-track P-sites per ORF by intersecting per-sample
  forward+reverse bedgraphs with the codon-start positions emitted by
  `CUSTOM_BED12CODONPOSITIONS`. Per-sample output is one row per ORF.
keywords:
  - riboseq
  - orf
  - psite
  - quantification
  - bedtools
tools:
  - bedtools:
      description: A powerful toolset for genome arithmetic
      homepage: https://bedtools.readthedocs.io/en/latest/
      documentation: https://bedtools.readthedocs.io/en/latest/content/bedtools-suite.html
      doi: "10.1093/bioinformatics/btq033"
      licence: ["MIT"]
      identifier: biotools:bedtools
input:
  - - meta:
        type: map
        description: Per-sample Ribo-seq metadata, with at least `id`
    - forward_bedgraph:
        type: file
        description: Forward-strand P-site bedgraph from plastid `make_wiggle`
        pattern: "*.bedgraph"
        ontologies: []
    - reverse_bedgraph:
        type: file
        description: Reverse-strand P-site bedgraph from plastid `make_wiggle`
        pattern: "*.bedgraph"
        ontologies: []
  - - meta2:
        type: map
        description: Cohort-level reference metadata
    - inframe_psites:
        type: file
        description: BED6 of in-frame codon-start positions, one row per ORF codon
        pattern: "*.bed"
        ontologies: []
output:
  counts:
    - - meta:
          type: map
          description: Per-sample metadata
      - "*.orf_inframe_psite_counts.tsv":
          type: file
          description: Per-sample three-column `(sample_id, orf_id, count)` TSV
          pattern: "*.orf_inframe_psite_counts.tsv"
          ontologies: []
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - bedtools:
          type: string
          description: The name of the tool
      - bedtools --version | cut -f2 -dv:
          type: string
          description: The version of the tool
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
