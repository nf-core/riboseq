name: filter_gtf_class_code
description: |
  Filter a gffcompare-annotated GTF to entries whose `class_code` attribute is
  in the supplied comma-separated set. Comment lines are dropped; entries
  without a `class_code` attribute are dropped.
keywords:
  - gtf
  - gffcompare
  - class_code
  - filter
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing identifiers, e.g. `[ id: 'stringtie_merge' ]`.
    - annotated_gtf:
        type: file
        description: GTF emitted by gffcompare (typically `*.annotated.gtf`).
        pattern: "*.gtf"
  - class_codes:
      type: string
      description: |
        Comma-separated list of gffcompare class codes to retain (e.g. `"u"`,
        `"u,x"`). See https://ccb.jhu.edu/software/stringtie/gffcompare.shtml.
output:
  - gtf:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.gtf":
          type: file
          description: Filtered GTF containing only entries matching one of the class codes.
          pattern: "*.gtf"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions.
          pattern: "versions.yml"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
