# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: orf_count_matrix
description: Pivot per-sample ORF P-site count TSVs into a single ORF x sample matrix
keywords:
  - riboseq
  - orf
  - quantification
  - matrix
tools:
  - python:
      description: Python interpreter
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF"]
      identifier: ""
  - pandas:
      description: Python data analysis library; provides the pivot used to build the ORF x sample matrix
      homepage: https://pandas.pydata.org/
      documentation: https://pandas.pydata.org/docs/
      licence: ["BSD-3-Clause"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Cohort-level metadata
    - per_sample_counts:
        type: file
        description: |
          Per-sample TSVs of `(sample_id, orf_id, count)` rows from
          `QUANTIFY_INFRAME_PSITE_PLASTID`. Staged under `counts/`.
        pattern: "*.tsv"
        ontologies: []
    - orf_catalogue_bed12:
        type: file
        description: ORF catalogue BED12; column 4 defines the matrix row order
        pattern: "*.bed*"
        ontologies: []
output:
  matrix:
    - - meta:
          type: map
          description: Cohort-level metadata
      - "${prefix}.tsv":
          type: file
          description: ORF x sample P-site count matrix, zero-filled for absent samples
          pattern: "*.tsv"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
