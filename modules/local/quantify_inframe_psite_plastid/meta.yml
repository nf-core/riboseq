# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: quantify_inframe_psite_plastid
description: |
  Count Ribo-seq P-sites that are in-frame. P-site counts are supplied
  as forward/reverse bedGraph files (e.g. as generated by plastid
  make_wiggle) and summed over every position of an in-frame P-sites
  BED file, aggregated per gene/transcript.
keywords:
  - riboseq
  - psite
  - plastid
  - bedtools
  - quantification
tools:
  - bedtools:
      description: A powerful toolset for genome arithmetic
      homepage: https://bedtools.readthedocs.io/en/latest/
      documentation: https://bedtools.readthedocs.io/en/latest/
      tool_dev_url: https://github.com/arq5x/bedtools2
      licence: ["MIT"]
      identifier: biotools:bedtools
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. [ id:'sample1' ]
    - forward_bedgraph:
        type: file
        description: Forward-strand P-site bedGraph
        pattern: "*.bedgraph"
        ontologies: []
    - reverse_bedgraph:
        type: file
        description: Reverse-strand P-site bedGraph
        pattern: "*.bedgraph"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map describing the in-frame P-sites BED file, holding
          at least the `feature` key (e.g. 'canonical_cds')
    - inframe_psites:
        type: file
        description: BED file of in-frame P-site positions
        pattern: "*.bed"
        ontologies: []
output:
  counts:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. [ id:'sample1' ]
      - "*_inframe_psite_counts.tsv":
          type: file
          description: In-frame P-site counts aggregated per gene/transcript
          pattern: "*_inframe_psite_counts.tsv"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
