# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: filter_counts_canonical
description: |
  Restrict a gene-level count matrix to the gene set defined by a canonical
  GTF. Used to keep the translational-efficiency analysis aligned with the
  canonical annotation backbone (issue #161 spec) when the user supplies a
  restricted `--canonical_gtf` such as MANE Select.
keywords:
  - riboseq
  - dte
  - filter
  - canonical
tools:
  - gawk:
      description: GNU awk
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Cohort-level metadata
    - counts:
        type: file
        description: Gene-level count matrix; first column is gene_id, remaining columns are samples
        pattern: "*.tsv"
        ontologies: []
  - - meta2:
        type: map
        description: Canonical-GTF metadata
    - canonical_gtf:
        type: file
        description: Canonical-backbone GTF defining the retained gene set
        pattern: "*.gtf"
        ontologies: []
output:
  counts:
    - - meta:
          type: map
          description: Cohort-level metadata
      - "*.canonical_filtered.tsv":
          type: file
          description: Count matrix retained to canonical gene IDs only
          pattern: "*.canonical_filtered.tsv"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
