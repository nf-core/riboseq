name: concat_gtf
description: |
  Concatenate a canonical reference GTF with a novel-transcript GTF to produce a
  hybrid annotation. Comment lines are dropped and entries are sorted by
  chromosome and start coordinate. If the novel GTF is empty or not provided,
  the output is equivalent to the canonical GTF (still sorted).
keywords:
  - gtf
  - annotation
  - concatenate
  - hybrid
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing identifiers, e.g. `[ id: 'hybrid_reference' ]`.
    - canonical_gtf:
        type: file
        description: Canonical reference GTF (one-transcript-per-gene backbone).
        pattern: "*.gtf"
    - novel_gtf:
        type: file
        description: |
          Novel-transcript GTF (e.g. class `u` filtered StringTie merge output).
          Optional - pass `[]` to skip and emit only the sorted canonical GTF.
        pattern: "*.gtf"
output:
  - gtf:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.gtf":
          type: file
          description: Hybrid GTF (canonical + novel, sorted).
          pattern: "*.gtf"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions.
          pattern: "versions.yml"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
