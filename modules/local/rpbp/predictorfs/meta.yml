name: rpbp_predictorfs
description: |
  Run Rp-Bp's Bayesian ORF caller (`predict-translated-orfs`) on a single
  Ribo-seq sample. Emits the per-sample predicted-ORF BED (with Bayes factor
  scores) and tab table. Runtime is dominated by the MCMC fit and is on the
  order of ~20-24h per replicate at genome-wide scale.
keywords:
  - rpbp
  - orf
  - bayesian
  - translation
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample identifiers, e.g. `[ id: 'sample_X' ]`.
    - bam:
        type: file
        description: Genome-coordinate Ribo-seq BAM.
        pattern: "*.bam"
    - bai:
        type: file
        description: BAM index.
        pattern: "*.bai"
    - prepared_index:
        type: directory
        description: Prepared Rp-Bp index directory (from `rpbp/preparegenome`).
    - config_yaml:
        type: file
        description: Rp-Bp YAML config (same file used at index-build time).
        pattern: "*.yaml"
output:
  - bed:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.predicted-orfs.bed.gz":
          type: file
          description: Predicted ORFs in BED format with Bayes factor scores.
          pattern: "*.predicted-orfs.bed.gz"
  - tab:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - "*.predicted-orfs.tab.gz":
          type: file
          description: Predicted ORFs as a tab-separated table.
          pattern: "*.predicted-orfs.tab.gz"
  - outdir:
      - meta:
          type: map
          description: Groovy Map inherited from input meta.
      - rpbp_out:
          type: directory
          description: Full Rp-Bp output directory (per-length-class tables, diagnostics).
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions.
          pattern: "versions.yml"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
